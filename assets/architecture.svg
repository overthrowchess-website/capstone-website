<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="Overthrow Chess architecture diagram">

  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 Z" fill="#fb923c"/>
    </marker>
    <marker id="ah2" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 Z" fill="rgba(251,146,60,0.45)"/>
    </marker>
    <marker id="ah3" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 Z" fill="rgba(139,92,246,0.8)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1180" height="560" fill="#101010" rx="14"/>

  <!-- Section group backgrounds -->
  <!-- CLIENTS -->
  <rect x="16" y="44" width="204" height="472" rx="11" fill="rgba(255,255,255,0.022)" stroke="rgba(255,255,255,0.065)" stroke-width="1"/>
  <!-- BACKEND -->
  <rect x="248" y="44" width="262" height="472" rx="11" fill="rgba(255,255,255,0.022)" stroke="rgba(255,255,255,0.065)" stroke-width="1"/>
  <!-- STORAGE -->
  <rect x="538" y="44" width="226" height="472" rx="11" fill="rgba(255,255,255,0.022)" stroke="rgba(255,255,255,0.065)" stroke-width="1"/>
  <!-- ANALYSIS + RELAY (taller to fit 3 cards) -->
  <rect x="792" y="44" width="372" height="472" rx="11" fill="rgba(255,255,255,0.022)" stroke="rgba(255,255,255,0.065)" stroke-width="1"/>

  <!-- Section labels -->
  <text x="118" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.27)" font-weight="700" letter-spacing="0.13em">CLIENTS</text>
  <text x="379" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.27)" font-weight="700" letter-spacing="0.13em">BACKEND</text>
  <text x="651" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.27)" font-weight="700" letter-spacing="0.13em">STORAGE</text>
  <text x="978" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.27)" font-weight="700" letter-spacing="0.13em">ANALYSIS + RELAY</text>

  <!-- iOS Client -->
  <rect x="32" y="98" width="172" height="108" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="118" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">iOS Client</text>
  <text x="118" y="159" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">React Native + Expo</text>
  <text x="118" y="176" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">TestFlight</text>

  <!-- Android Client -->
  <rect x="32" y="258" width="172" height="108" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="118" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">Android Client</text>
  <text x="118" y="319" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">React Native + Expo</text>
  <text x="118" y="336" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">APK sideload</text>

  <!-- Go API -->
  <rect x="264" y="88" width="230" height="128" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="379" y="130" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">Go API / Auth</text>
  <text x="379" y="150" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">REST endpoints</text>
  <text x="379" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Session management</text>
  <text x="379" y="184" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">User metadata</text>

  <!-- Game Server -->
  <rect x="264" y="258" width="230" height="128" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="379" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">Game Server</text>
  <text x="379" y="320" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">WebSockets</text>
  <text x="379" y="337" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Move validation · Ratings</text>
  <text x="379" y="354" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Real-time sync</text>

  <!-- PostgreSQL -->
  <rect x="554" y="104" width="194" height="96" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="651" y="144" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">PostgreSQL</text>
  <text x="651" y="163" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Users · Games · Stats</text>
  <text x="651" y="180" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Persistent storage</text>

  <!-- Redis -->
  <rect x="554" y="258" width="194" height="96" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="651" y="298" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">Redis</text>
  <text x="651" y="317" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Session state</text>
  <text x="651" y="334" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Matchmaking queues</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANALYSIS + RELAY — 3 cards             -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Stockfish (top) -->
  <rect x="808" y="84" width="340" height="100" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="978" y="124" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">Stockfish</text>
  <text x="978" y="143" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Post-game evaluation</text>
  <text x="978" y="160" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Move classification pipeline</text>

  <!-- LightGBM (middle) -->
  <rect x="808" y="216" width="340" height="116" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="978" y="256" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">LightGBM</text>
  <text x="978" y="275" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Move quality classifier</text>
  <text x="978" y="292" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Stockfish eval + player data</text>
  <text x="978" y="309" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Custom-trained model</text>

  <!-- coturn (bottom) -->
  <rect x="808" y="364" width="340" height="100" rx="10" fill="#1b1b1b" stroke="rgba(255,255,255,0.085)" stroke-width="1"/>
  <text x="978" y="404" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">coturn / WebRTC</text>
  <text x="978" y="423" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">STUN/TURN relay</text>
  <text x="978" y="440" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="rgba(255,255,255,0.4)">Voice chat signaling</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ARROWS                                 -->
  <!-- ═══════════════════════════════════════ -->

  <!-- PRIMARY ARROWS (solid orange) -->
  <!-- iOS → Go API -->
  <line x1="204" y1="152" x2="262" y2="152" stroke="#fb923c" stroke-width="2" marker-end="url(#ah)"/>
  <!-- Android → Game Server -->
  <line x1="204" y1="312" x2="262" y2="312" stroke="#fb923c" stroke-width="2" marker-end="url(#ah)"/>
  <!-- Go API → PostgreSQL -->
  <line x1="494" y1="152" x2="552" y2="152" stroke="#fb923c" stroke-width="2" marker-end="url(#ah)"/>
  <!-- Game Server → Redis -->
  <line x1="494" y1="312" x2="552" y2="312" stroke="#fb923c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- SECONDARY ARROWS (dashed orange) -->
  <!-- Game Server → Stockfish -->
  <polyline points="494,282 556,282 556,200 790,200 790,134 806,134" fill="none" stroke="rgba(251,146,60,0.42)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah2)"/>
  <!-- Game Server → coturn -->
  <polyline points="494,342 556,342 556,390 790,390 790,414 806,414" fill="none" stroke="rgba(251,146,60,0.42)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah2)"/>

  <!-- Stockfish → LightGBM -->
  <line x1="978" y1="184" x2="978" y2="214" stroke="#fb923c" stroke-width="2" marker-end="url(#ah)"/>

</svg>
